<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowLink Challenge</title>
<meta property="og:title" content="⚔️ FlowLink challenge: can you beat my time?">
<meta property="og:description" content="Same 3 puzzles, who is faster? Tap to play.">
<style>
:root{--bg:#152033;--fg:#eef2fa;--mut:#9fb0cf;--y:#ffc94a}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#2b4370,#152033 60%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center}
main{max-width:420px;width:100%}
h1{font-size:2.2rem;margin:.2em 0}h1 span{color:var(--y)}
.code{font-size:1.6rem;font-weight:800;letter-spacing:2px;background:#0d1526;border-radius:14px;padding:12px;margin:14px 0}
a.btn{display:block;background:var(--y);color:#152033;text-decoration:none;font-weight:800;padding:14px;border-radius:999px;margin:10px 0;font-size:1.1rem}
a.ghost{background:transparent;color:var(--fg);border:2px solid #3a4b70}
p{color:var(--mut);line-height:1.5}
</style></head>
<body><main>
<h1>Flow<span>Link</span></h1>
<p id="msg"></p>
<div class="code" id="code"></div>
<a class="btn" id="open"></a>
<a class="btn ghost" id="get" href="https://play.google.com/store/apps/details?id=com.flowlinkstudio.flowlink"></a>
<p id="hint"></p>
</main>
<script>
const q=new URLSearchParams(location.search),c=(q.get('c')||'').replace(/\D/g,'').slice(0,5),t=(q.get('t')||'').replace(/\D/g,'').slice(0,5);
const ar=/^ar/i.test(navigator.language||''),T=ar?{
 msg:t?`صاحبك خلّص التحدي في ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} ⚔️ تقدر تغلبه؟`:'صاحبك بيتحداك في FlowLink ⚔️',
 open:'افتح التحدي',get:'حمّل اللعبة من Google Play',hint:'لو اللعبة لسه مش عندك: نزّلها، وبعدين افتح "تحدّى صاحبك" واكتب الكود ده.'}:{
 msg:t?`Your friend finished the challenge in ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} ⚔️ Can you beat them?`:'Your friend challenges you in FlowLink ⚔️',
 open:'Open the challenge',get:'Get the game on Google Play',hint:"Don't have the game yet? Install it, open “Challenge a friend” and enter this code."};
document.documentElement.lang=ar?'ar':'en';document.dir=ar?'rtl':'ltr';
for(const k of ['msg','hint'])document.getElementById(k).textContent=T[k];
document.getElementById('get').textContent=T.get;
const store='https://play.google.com/store/apps/details?id=com.flowlinkstudio.flowlink&referrer='+encodeURIComponent('chal='+c+(t?'&t='+t:''));
document.getElementById('get').href=store;
document.getElementById('code').textContent=c?'FL-'+c:'';
const intent=`intent://c/${c}${t?'/'+t:''}#Intent;scheme=flowlink;package=com.flowlinkstudio.flowlink;S.browser_fallback_url=${encodeURIComponent(store)};end`;
const o=document.getElementById('open');o.textContent=T.open;o.href=/android/i.test(navigator.userAgent)?intent:store;
if(c&&/android/i.test(navigator.userAgent))setTimeout(()=>{location.href=intent},300);
</script>
</body></html>
